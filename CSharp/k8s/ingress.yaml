apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tunaengine-ingress
  namespace: tunaengine
spec:
  ingressClassName: nginx
  rules:
    - host: tunaengine.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
